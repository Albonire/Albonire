<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 112" width="300" height="112" role="img" aria-labelledby="t">
  <title id="t">AND gate with inputs A and B and output Y, cycling through its truth table</title>
  <style>
    .dim { stroke: #c9d3df; }
    .lit { stroke: #1f3a5f; opacity: 0; }
    .wire { fill: none; stroke-width: 2.5; stroke-linecap: butt; }
    .body { fill: none; stroke: #1f3a5f; stroke-width: 2.5; stroke-linejoin: miter; }
    text { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { fill: #5b6b80; }
    .bit { fill: #1f3a5f; }
    .d0 { opacity: 1; }
    .d1 { opacity: 0; }
    .la, .a1 { animation: a-on 8s linear infinite; }
    .lb, .b1 { animation: b-on 8s linear infinite; }
    .ly, .y1 { animation: y-on 8s linear infinite; }
    .a0 { animation: a-off 8s linear infinite; }
    .b0 { animation: b-off 8s linear infinite; }
    .y0 { animation: y-off 8s linear infinite; }
    @keyframes a-on  { 0%,23%{opacity:0} 26%,48%{opacity:1} 51%,73%{opacity:0} 76%,97%{opacity:1} 100%{opacity:0} }
    @keyframes a-off { 0%,23%{opacity:1} 26%,48%{opacity:0} 51%,73%{opacity:1} 76%,97%{opacity:0} 100%{opacity:1} }
    @keyframes b-on  { 0%,48%{opacity:0} 51%,97%{opacity:1} 100%{opacity:0} }
    @keyframes b-off { 0%,48%{opacity:1} 51%,97%{opacity:0} 100%{opacity:1} }
    @keyframes y-on  { 0%,73%{opacity:0} 76%,97%{opacity:1} 100%{opacity:0} }
    @keyframes y-off { 0%,73%{opacity:1} 76%,97%{opacity:0} 100%{opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .la, .lb, .ly, .a1, .b1, .y1 { animation: none; opacity: 1; }
      .a0, .b0, .y0 { animation: none; opacity: 0; }
    }
  </style>
  <path class="wire dim" d="M28 40.25H119.5 M28 71.75H119.5 M180.75 56H262"/>
  <path class="wire lit la" d="M28 40.25H119.5"/>
  <path class="wire lit lb" d="M28 71.75H119.5"/>
  <path class="wire lit ly" d="M180.75 56H262"/>
  <path class="body" d="M119.5 19.25H144A36.75 36.75 0 0 1 144 92.75H119.5Z"/>
  <text class="name" x="8" y="44.75">A</text>
  <text class="name" x="8" y="76.25">B</text>
  <text class="name" x="272" y="60.5">Y</text>
  <text class="bit d0 a0" x="40" y="32">0</text><text class="bit d1 a1" x="40" y="32">1</text>
  <text class="bit d0 b0" x="40" y="63.5">0</text><text class="bit d1 b1" x="40" y="63.5">1</text>
  <text class="bit d0 y0" x="252" y="48">0</text><text class="bit d1 y1" x="252" y="48">1</text>
</svg>
